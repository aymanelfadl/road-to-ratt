<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Web Sémantique — Entraînement par questions</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 fill=%22black%22/><text x=%2250%25%22 y=%2258%25%22 font-size=%2244%22 fill=%22white%22 text-anchor=%22middle%22 font-family=%22monospace%22>WS</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=5">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <div>
      <div class="brand-title">Web Sémantique</div>
      <div class="brand-sub">Master · questions &amp; corrections</div>
    </div>
  </div>
  <div class="topbar-right">
    <div class="progress-wrap">
      <div class="progress-text" id="progressText">0 / 0 maîtrisées</div>
      <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    </div>
    <a class="btn btn-primary subject-link" href="bigdata/">Big Data →</a>
  </div>
</header>

<div class="layout">
  <aside class="sidebar">
    <div class="sidebar-section">
      <h3>Thème</h3>
      <div id="topicList" class="filter-list"></div>
    </div>
    <div class="sidebar-section">
      <h3>Source</h3>
      <div class="filter-list">
        <label><input type="checkbox" value="exam-2020" class="src-filter" checked> Examen réel 2020</label>
        <label><input type="checkbox" value="exam-2025" class="src-filter" checked> Examen réel 2025</label>
        <label><input type="checkbox" value="original" class="src-filter" checked> Exercice inédit</label>
      </div>
    </div>
    <div class="sidebar-section">
      <label class="toggle-row">
        <input type="checkbox" id="hideMastered">
        Masquer les questions déjà maîtrisées
      </label>
      <label class="toggle-row">
        <input type="checkbox" id="shuffleMode">
        Ordre aléatoire
      </label>
    </div>
    <div class="sidebar-section">
      <button id="resetBtn" class="btn btn-ghost btn-small">Réinitialiser la progression</button>
    </div>
  </aside>

  <main class="main">
    <div id="emptyState" class="empty-state" hidden>
      <p>Aucune question ne correspond aux filtres sélectionnés.</p>
    </div>

    <div id="card" class="card">
      <div class="card-head">
        <span class="badge badge-topic" id="qTopic"></span>
        <span class="badge badge-source" id="qSource"></span>
        <span class="card-index" id="qIndex"></span>
      </div>
      <h2 class="card-title" id="qTitle"></h2>

      <div class="prose" id="qPrompt"></div>

      <div id="correctionBlock" hidden>
        <hr class="sep">
        <div class="correction-label">Corrigé</div>
        <div class="prose prose-correction" id="qCorrection"></div>
      </div>

      <div class="card-actions">
        <button id="revealBtn" class="btn btn-primary">Afficher la correction</button>
        <div id="gradeButtons" class="grade-buttons" hidden>
          <button id="reviewBtn" class="btn btn-warn">À revoir</button>
          <button id="masteredBtn" class="btn btn-success">Je savais</button>
        </div>
      </div>
    </div>

    <div class="nav-row">
      <button id="prevBtn" class="btn btn-ghost">← Précédente</button>
      <button id="skipBtn" class="btn btn-ghost">Passer →</button>
    </div>
  </main>
</div>

<footer class="footer">
  Contenu extrait de la fiche de révision Web Sémantique.
</footer>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="app.js?v=5"></script>
</body>
</html>
